name: Deploy

# Runs on every push to master. Tests always run; the deploy job only runs
# if something deployable changed, and only after a human approves it in
# the "production" GitHub Environment (Settings -> Environments ->
# production -> required reviewers).

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  changes:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      functions: ${{ steps.filter.outputs.functions }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'
            functions:
              - 'supabase/functions/**'
            frontend:
              - 'apps/**'
              - 'packages/**'

  deploy:
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: |
      needs.changes.outputs.migrations == 'true' ||
      needs.changes.outputs.functions == 'true' ||
      needs.changes.outputs.frontend == 'true'
    # Pauses here until a required reviewer approves, per the environment's
    # protection rules in repo settings.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.functions == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push DB migrations
        if: needs.changes.outputs.migrations == 'true'
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy edge functions
        if: needs.changes.outputs.functions == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm run build:firebase

      - name: Deploy hosting
        if: needs.changes.outputs.frontend == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: recoveryos-app
          channelId: live
