<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2140" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReCOVR" />
    <!-- iOS ignores SVG touch icons and needs an opaque square PNG (it applies
         its own mask; transparent corners would render black). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/m/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/m/icons/icon.svg" />
    <title>ReCOVR</title>
    <meta name="description" content="תוכנית השיקום היומית שלי · ReCOVR by krispel" />
    <!-- Link-preview tags: WhatsApp/email/social crawlers don't run JS, so
         these must be static and og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReCOVR" />
    <meta property="og:title" content="ReCOVR by krispel" />
    <meta property="og:description" content="תוכנית השיקום היומית שלי" />
    <meta property="og:image" content="%VITE_SITE_URL%/m/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%VITE_SITE_URL%/m/" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReCOVR by krispel" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/m/brand/og-image.png" />
    <!-- Fonts every first screen uses (Heebo Hebrew + Latin, Frank Ruhl Hebrew for
         headings): start fetching them with the HTML instead of after the CSS. -->
    <link rel="preload" href="/m/fonts/heebo-1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/m/fonts/heebo-5.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/m/fonts/frank-ruhl-libre-1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/m/fonts/heebo.css" />
    <link rel="stylesheet" href="/m/fonts/frank-ruhl-libre.css" />
    <!-- The page behind the app shell shows for a frame while iOS animates a
         rotation (and on launch before JS); navy like the shell, not white.
         No rubber-band on the page itself — only the content pane scrolls. -->
    <style>
      html, body { background: #1B2140; overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
