<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installable to the home screen: on iOS, web push only reaches installed apps. -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="ReCOVR Clinic" />
    <meta name="theme-color" content="#FBF6EC" />
    <title>ReCOVR</title>
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <!-- Self-hosted fonts -->
    <!-- Fonts every first screen uses (Heebo Hebrew + Latin — the only typeface):
         start fetching them with the HTML instead of after the CSS. -->
    <link rel="preload" href="/app/fonts/heebo-1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/app/fonts/heebo-5.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/app/fonts/heebo.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
