# Supabase local development configuration
# https://supabase.com/docs/guides/cli/config

project_id = "recoveryos"

[api]
enabled = true
port = 54321
schemas = ["app", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
sql_paths = ['./seed/protocols_import.sql', './seed/measure_definitions_import.sql', './seed/seed.sql']

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5174",
  "http://localhost:5173/**",
  "http://localhost:5174/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # clinics invite only
enable_anonymous_sign_ins = false

# TOTP second factor. Admins must enroll; clinicians may opt in. Enforced
# server-side by supabase/functions/_shared/mfa.ts (aal2 required).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
inspector_port = 8083
policy = "oneshot"

[analytics]
enabled = false

# Gateway JWT verification is off for every function: each one verifies the
# caller itself (supabase/functions/_shared/auth.ts — local JWKS check for
# asymmetric signing keys, Auth server for legacy HS256), and the gateway
# check doesn't work with asymmetric signing keys (Supabase docs: turn it off
# before rotating away from the legacy JWT secret). A new function must call
# getAuthUser() before touching data.
[functions.me-today]
verify_jwt = false

[functions.me-sessions-items]
verify_jwt = false

[functions.me-progress]
verify_jwt = false

[functions.me-plan]
verify_jwt = false

[functions.me-education]
verify_jwt = false

[functions.phase-approve]
verify_jwt = false

[functions.patient-invite]
verify_jwt = false

[functions.patient-accept]
verify_jwt = false  # first-time invite token, not a session

[functions.dashboard]
verify_jwt = false

[functions.patients]
verify_jwt = false

[functions.clinician-me]
verify_jwt = false

[functions.protocols]
verify_jwt = false

[functions.alerts]
verify_jwt = false

[functions.patient-overview]
verify_jwt = false

[functions.plan]
verify_jwt = false

[functions.plan-templates]
verify_jwt = false

[functions.exercises]
verify_jwt = false

[functions.criteria]
verify_jwt = false

[functions.measurements]
verify_jwt = false

[functions.assessment-visits]
verify_jwt = false

[functions.device-tokens]
verify_jwt = false

[functions.messages]
verify_jwt = false

[functions.me-messages]
verify_jwt = false

[functions.settings]
verify_jwt = false

[functions.me-export]
verify_jwt = false

[functions.me-delete-request]
verify_jwt = false

[functions.deletion-requests]
verify_jwt = false

[functions.client-errors]
verify_jwt = false  # a crash can happen before login; JWT decoded when present

[functions.notifications-dispatch]
verify_jwt = false  # cron / DISPATCH_SECRET-gated, not a user session

[functions.scheduling]
verify_jwt = false

[functions.me-appointments]
verify_jwt = false

[functions.public-booking]
verify_jwt = false  # the public booking page: no session; rate-limited per IP
