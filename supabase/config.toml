# Supabase local development configuration
# https://supabase.com/docs/guides/cli/config

project_id = "recoveryos"

[api]
enabled = true
port = 54321
schemas = ["app", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
sql_paths = ['./seed/protocols_import.sql', './seed/measure_definitions_import.sql', './seed/seed.sql']

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5174",
  "http://localhost:5173/**",
  "http://localhost:5174/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # clinics invite only
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
inspector_port = 8083
policy = "oneshot"

[analytics]
enabled = false

[functions.me-today]
verify_jwt = true

[functions.me-sessions-items]
verify_jwt = true

[functions.me-progress]
verify_jwt = true

[functions.me-plan]
verify_jwt = true

[functions.me-education]
verify_jwt = true

[functions.phase-approve]
verify_jwt = true

[functions.patient-invite]
verify_jwt = true

[functions.patient-accept]
verify_jwt = false  # first-time invite token, not a session

[functions.dashboard]
verify_jwt = true

[functions.patients]
verify_jwt = true

[functions.alerts]
verify_jwt = true

[functions.patient-overview]
verify_jwt = true

[functions.plan]
verify_jwt = true

[functions.plan-templates]
verify_jwt = true

[functions.exercises]
verify_jwt = true

[functions.criteria]
verify_jwt = true

[functions.measurements]
verify_jwt = true

[functions.assessment-visits]
verify_jwt = true

[functions.device-tokens]
verify_jwt = true

[functions.messages]
verify_jwt = true

[functions.me-messages]
verify_jwt = true

[functions.settings]
verify_jwt = true

[functions.notifications-dispatch]
verify_jwt = false  # cron / DISPATCH_SECRET-gated, not a user session
